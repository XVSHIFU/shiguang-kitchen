# AI 饮食与健康生活管家 — Nginx 入口配置（Compose 形态 A）
#
# 角色：唯一公网入口。静态文件直接 served（frontend/ 只读挂载到
# /usr/share/nginx/html），/api/、/mcp、/health/、/docs、/openapi.json
# 反代到 api 服务。api 服务不直接暴露端口。
#
# 注意：api 服务自身也挂载了 frontend/（形态 B 单机 uvicorn 时由
# FastAPI serve）。Compose 里两者不冲突：走到 web 的请求由本文件
# 分流，静态走 Nginx、API 走反代，api 的静态挂载在 Compose 里
# 不会被访问到；形态 B 没有 Nginx，api 的挂载才生效。
#
# SSE 说明：/api/v1/agent/runs/ 必须关 proxy_buffering、拉长超时，
# 否则事件流会被 Nginx 攒着不发。location 按最长前缀匹配，该段
# 写在通用 /api/ 之前（两者都匹配时取更长的那条）。

upstream api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- 健康检查与 API 文档：反代到 api ----
    location /health/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /redoc {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Agent SSE 事件流：关缓冲、长超时 ----
    location /api/v1/agent/runs/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # ---- 业务 API 与 MCP（/api/v1/mcp 与根路径 /mcp 均由后端提供）----
    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # Cookie / CSRF 靠同源传递，不要改写。
    }

    location /mcp {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- 静态前端 ----
    # index.html 永不缓存：入口 HTML 永远取最新，改版后用户立即看到新页面。
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }

    # 其余静态资源长期缓存。
    # 已知局限：styles.css / app.js 等文件名不带内容哈希，长期缓存下
    # 前端改版后个别用户可能看到旧 CSS/JS，直到缓存过期或强制刷新。
    # 若要根治，需给前端产物加哈希命名（后续前端改造项，本次不改）。
    location ~* \.(css|js|mjs|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|map)$ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
